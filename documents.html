<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>revision</title>

<link href="https://fonts.googleapis.com/css2?family=Delius&display=swap" rel="stylesheet">

<style>
body{
    background:#edd8ed;
    font-family:"Delius",cursive;
    margin:0;
    padding:50px;
    color:#6d6d6d;
}

.card{
    background:white;
    max-width:1000px;
    margin:auto;
    padding:45px;
    border-radius:35px;
    box-shadow:0 12px 30px rgba(0,0,0,.15);
    text-align:center;
}

h1{
    font-size:58px;
    font-weight:normal;
}

textarea{
    width:90%;
    height:260px;
    padding:25px;
    font-size:22px;
    font-family:"Delius",cursive;
    color:#6d6d6d;
    border:3px solid #edd8ed;
    border-radius:25px;
    outline:none;
    resize:none;
    background:repeating-linear-gradient(
        white,
        white 38px,
        #f3dff3 39px
    );
    line-height:39px;
}

.palette{
    margin:20px 0;
}

.colour{
    width:36px;
    height:36px;
    border-radius:50%;
    border:none;
    cursor:pointer;
    margin:6px;
    box-shadow:0 2px 6px rgba(0,0,0,.2);
}

canvas{
    width:100%;
    max-width:800px;
    height:400px;
    background:white;
    border:3px solid #edd8ed;
    border-radius:25px;
    margin-top:20px;
    cursor:crosshair;
    touch-action:none;
}

.button{
    display:inline-block;
    margin:15px 8px;
    background:#f8edf8;
    padding:13px 30px;
    border-radius:35px;
    border:none;
    text-decoration:none;
    font-size:22px;
    color:#6d6d6d;
    font-family:"Delius",cursive;
    cursor:pointer;
}

.button:hover{
    background:#edd8ed;
}
</style>
</head>

<body>

<div class="card">

<h1>revision notes</h1>

<textarea placeholder="write your revision notes here..."></textarea>

<h1>drawing pad</h1>

<div class="palette">
    <button class="colour" style="background:#ff4d4d" onclick="setColour('#ff4d4d')"></button>
    <button class="colour" style="background:#ff9900" onclick="setColour('#ff9900')"></button>
    <button class="colour" style="background:#ffd633" onclick="setColour('#ffd633')"></button>
    <button class="colour" style="background:#5cd65c" onclick="setColour('#5cd65c')"></button>
    <button class="colour" style="background:#4da6ff" onclick="setColour('#4da6ff')"></button>
    <button class="colour" style="background:#9933ff" onclick="setColour('#9933ff')"></button>
    <button class="colour" style="background:#ff99cc" onclick="setColour('#ff99cc')"></button>
    <button class="colour" style="background:white;border:2px solid #ccc;" onclick="setColour('white')"></button>
    <button class="colour" style="background:#999999" onclick="setColour('#999999')"></button>
    <button class="colour" style="background:black" onclick="setColour('black')"></button>

    <button class="button" onclick="eraser()">eraser</button>
</div>

<canvas id="draw"></canvas>

<br>

<button class="button" onclick="clearCanvas()">clear drawing</button>
<a class="button" href="index.html">⌂ home</a>

</div>

<script>
const canvas = document.getElementById("draw");

function resizeCanvas(){
    canvas.width = Math.min(800, canvas.offsetWidth);
    canvas.height = 400;
}

resizeCanvas();
window.addEventListener("resize", resizeCanvas);

const ctx = canvas.getContext("2d");

let drawing = false;

ctx.lineWidth = 4;
ctx.lineCap = "round";
ctx.strokeStyle = "#6d6d6d";

function setColour(colour){
    ctx.strokeStyle = colour;
}

function eraser(){
    ctx.strokeStyle = "white";
}

function getPosition(e){
    const rect = canvas.getBoundingClientRect();

    if(e.touches){
        return {
            x: e.touches[0].clientX - rect.left,
            y: e.touches[0].clientY - rect.top
        };
    }

    return {
        x: e.clientX - rect.left,
        y: e.clientY - rect.top
    };
}

function startDrawing(e){
    drawing = true;
    const pos = getPosition(e);
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);
}

function draw(e){
    if(!drawing) return;
    e.preventDefault();
    const pos = getPosition(e);
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
}

function stopDrawing(){
    drawing = false;
}

function clearCanvas(){
    ctx.clearRect(0, 0, canvas.width, canvas.height);
}

canvas.addEventListener("mousedown", startDrawing);
canvas.addEventListener("mousemove", draw);
canvas.addEventListener("mouseup", stopDrawing);
canvas.addEventListener("mouseleave", stopDrawing);

canvas.addEventListener("touchstart", startDrawing);
canvas.addEventListener("touchmove", draw);
canvas.addEventListener("touchend", stopDrawing);
</script>

</body>
</html>
