.card{
    max-width:900px;
    margin:auto;
    background:white;
    border-radius:35px;
    padding:55px;
    text-align:center;

h1{

p{

.button{
    display:inline-block;
    background:#f8edf8;
    color:#6d6d6d;
    text-decoration:none;
    padding:16px 34px;
    margin:12px;
    border-radius:40px;
    font-size:25px;
    transition:.3s;

.button:hover{
    background:#edd8ed;

/* Widescreen Unblocked Video Container Styles */
.player-container {
    width: 100%;
    margin: 40px auto 10px auto;
    background: #1a1a1a;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    border: 1px solid #ebd9eb;
    text-align: left;
}

.video-wrapper {
    position: relative;
    padding-bottom: 56.25%; /* Fixed 16:9 Aspect Ratio */
    height: 0;
    background: #000;
}

.video-wrapper iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: 0;
}

.video-details {
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

.video-details h2 {
    font-size: 1.3rem;
    margin-bottom: 8px;
    color: #f1f1f1;
    font-weight: 600;
}

.video-details p {
    font-size: 0.9rem;
    color: #aaaaaa;
    margin-bottom: 0;
    line-height: 1.5;
}

.tag {
    display: inline-block;
    background: #e50914;
    color: white;
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 0.75rem;
    font-weight: bold;
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.footer{
    margin-top:45px;
    font-size:20px;
}

/* Fixes display constraints for narrower mobile windows */
@media (max-width: 600px) {
    h1 { font-size: 40px; }
    p { font-size: 22px; }
