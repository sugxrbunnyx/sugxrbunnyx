<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>pretty princess</title>

<link href="https://googleapis.com" rel="stylesheet">

<style>

body{
    background:#edd8ed;
    font-family:"Delius",cursive;
    margin:0;
    padding:60px 20px;
    color:#6d6d6d;
}

.card{
    max-width:900px;
    margin:auto;
    background:white;
    border-radius:35px;
    padding:55px;
    text-align:center;
    box-shadow:0 12px 30px rgba(0,0,0,.15);
}

h1{
    font-size:64px;
    font-weight:normal;
    margin-bottom:15px;
}

p{
    font-size:30px;
    margin-bottom:40px;
}

.button{
    display:inline-block;
    background:#f8edf8;
    color:#6d6d6d;
    text-decoration:none;
    padding:16px 34px;
    margin:12px;
    border-radius:40px;
    font-size:25px;
    transition:.3s;
}

.button:hover{
    background:#edd8ed;
    transform:translateY(-3px);
}

/* Enlarged Max-Size Unblocked Video Container Styles */
.player-container {
    width: 100%;
    margin: 40px auto 10px auto;
    background: #000000;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    border: 2px solid #ebd9eb;
}

.video-wrapper {
    position: relative;
    padding-bottom: 56.25%; /* Perfect 16:9 Aspect Ratio */
    height: 0;
    background: #000;
    width: 100%;
}

.video-wrapper iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: 0;
}

.footer{
    margin-top:45px;
    font-size:20px;
}

/* Fixes display constraints for narrower mobile windows */
@media (max-width: 600px) {
    h1 { font-size: 40px; }
    p { font-size: 22px; }
    .button { font-size: 18px; padding: 12px 24px; }
    body { padding: 30px 10px; }
}

</style>

</head>

<body>

<div class="card">

<h1>hello pretty princess!</h1>

<p>ദ്ദി(｡•̀ ,&lt;)~✩‧₊</p>

<a class="button" href="notes.html">♡ pictures ♡</a>

<a class="button" href="documents.html">♡ revision ♡</a>

<!-- Integrated Clean Streaming Player (Max Size, No Banner) -->
<div class="player-container">
    <div class="video-wrapper">
        <iframe 
            src="https://archive.org" 
            allowfullscreen="true" 
            webkitallowfullscreen="true" 
            mozallowfullscreen="true">
        </iframe>
    </div>
</div>

<div class="footer">
made by sugxrbunnyx ♡
</div>

</div>

</body>
</html>
