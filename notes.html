<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pictures</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #edd8ed;
            font-family: "Delius", cursive;
            padding: 40px 20px;
            color: #6d6d6d;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        .header h1 {
            font-size: 50px;
            font-weight: normal;
            margin-bottom: 5px;
            color: #6d6d6d;
        }
        .header p {
            font-size: 20px;
            color: #8a8a8a;
        }
        .back-btn {
            display: inline-block;
            margin-top: 15px;
            background: #ffffff;
            color: #6d6d6d;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: 0.3s;
        }
        .back-btn:hover {
            background: #f8edf8;
            transform: translateY(-2px);
        }

        /* --- PINTEREST MASONRY GRID SYSTEM --- */
        .pinterest-grid {
            columns: 3; /* Perfect look for school laptop screens */
            column-gap: 20px;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
        }

        .pin {
            background: white;
            break-inside: avoid;
            margin-bottom: 20px;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            cursor: pointer;
            display: block;
            border: 1px solid #ebd9eb;
        }
        
        .pin:hover {
            transform: scale(1.02);
            box-shadow: 0 12px 30px rgba(0,0,0,0.12);
        }

        .pin img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        .like-container {
            padding: 15px;
            background: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .caption {
            font-size: 16px;
            color: #6d6d6d;
        }
        .like-btn {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            transition: transform 0.2s ease;
            color: #e2cee2;
        }
        .like-btn.liked {
            color: #e50914;
            transform: scale(1.25);
        }

        @media (max-width: 600px) {
            .pinterest-grid { columns: 2; column-gap: 12px; }
            .header h1 { font-size: 36px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>pictures</h1>
        <p>my cute little collection ♡</p>
        <a href="index.html" class="back-btn">♡ go back home</a>
    </div>

    <!-- Pinterest Board Grid Using Unblocked Verified Stock Domains -->
    <div class="pinterest-grid">

        <!-- PIN 1: Aesthetic Kitty (Pixabay) -->
        <div class="pin">
            <img src="https://pixabay.com" alt="Cute Kitty">
            <div class="like-container">
                <span class="caption">cozy sleeping kitty ☁️</span>
                <button class="like-btn" onclick="toggleLike(this)">♥</button>
            </div>
        </div>

        <!-- PIN 2: Pink Flowers (Pexels) -->
        <div class="pin">
            <img src="https://pexels.com" alt="Pink Tulips">
            <div class="like-container">
                <span class="caption">pink tulip paradise 🌷</span>
                <button class="like-btn" onclick="toggleLike(this)">♥</button>
            </div>
        </div>

        <!-- PIN 3: Cute Fluffy Bunny (Pexels) -->
        <div class="pin">
            <img src="https://pexels.com" alt="Bunny">
            <div class="like-container">
                <span class="caption">soft baby bunny 🐇</span>
                <button class="like-btn" onclick="toggleLike(this)">♥</button>
            </div>
        </div>

        <!-- PIN 4: Strawberry Drink (Pexels) -->
        <div class="pin">
            <img src="https://pexels.com" alt="Strawberry Drink">
            <div class="like-container">
                <span class="caption">strawberry milk vibe 🍓</span>
                <button class="like-btn" onclick="toggleLike(this)">♥</button>
            </div>
        </div>

        <!-- PIN 5: Soft White Cat (Pexels) -->
        <div class="pin">
            <img src="https://pexels.com" alt="White Kitty">
            <div class="like-container">
                <span class="caption">angel marshmallow kitty ✨</span>
                <button class="like-btn" onclick="toggleLike(this)">♥</button>
            </div>
        </div>

        <!-- PIN 6: Cozy Mug (Pixabay) -->
        <div class="pin">
            <img src="https://pixabay.com" alt="Cozy Mug">
            <div class="like-container">
                <span class="caption">sweet cocoa break ☕️</span>
                <button class="like-btn" onclick="toggleLike(this)">♥</button>
            </div>
        </div>

    </div>

    <div class="footer" style="text-align: center; margin-top: 45px; font-size: 20px;">
        made by sugxrbunnyx ♡
    </div>

    <script>
        function toggleLike(btn) {
            btn.classList.toggle('liked');
        }
    </script>
</body>
</html>
