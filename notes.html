    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #edd8ed;
            font-family: "Delius", cursive;
            padding: 40px 20px;
            color: #6d6d6d;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        .header h1 {
            font-size: 50px;
            font-weight: normal;
            margin-bottom: 5px;
            color: #6d6d6d;
        }
        .header p {
            font-size: 20px;
            color: #8a8a8a;
        }
        .back-btn {
            display: inline-block;
            margin-top: 15px;
            background: #ffffff;
            color: #6d6d6d;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: 0.3s;
        }
        .back-btn:hover {
            background: #f8edf8;
            transform: translateY(-2px);
        }

        /* --- PINTEREST MASONRY GRID SYSTEM --- */
        .pinterest-grid {
            columns: 3;
            column-gap: 20px;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
        }

        .pin {
            background: white;
            break-inside: avoid;
            margin-bottom: 20px;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            cursor: pointer;
            display: block;
            border: 1px solid #ebd9eb;
        }
        
        .pin:hover {
            transform: scale(1.02);
            box-shadow: 0 12px 30px rgba(0,0,0,0.12);
        }

        .pin img {
            width: 100%;
            height: auto;
            display: block;
        }

        .like-container {
            padding: 15px;
            background: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .caption {
            font-size: 16px;
            color: #6d6d6d;
        }
        .like-btn {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            transition: transform 0.2s ease;
            color: #e2cee2;
        }
        .like-btn.liked {
            color: #e50914;
            transform: scale(1.25);
        }

        @media (max-width: 600px) {
            .pinterest-grid { columns: 2; column-gap: 12px; }
            .header h1 { font-size: 36px; }
        }
    </style>
</head>
