<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pictures</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #edd8ed;
            font-family: "Delius", cursive;
            padding: 40px 20px;
            color: #6d6d6d;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        .header h1 {
            font-size: 50px;
            font-weight: normal;
            margin-bottom: 5px;
            color: #6d6d6d;
        }
        .header p {
            font-size: 20px;
            color: #8a8a8a;
        }
        .back-btn {
            display: inline-block;
            margin-top: 15px;
            background: #ffffff;
            color: #6d6d6d;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: 0.3s;
        }
        .back-btn:hover {
            background: #f8edf8;
            transform: translateY(-2px);
        }

        /* --- PINTEREST MASONRY GRID SYSTEM --- */
        .pinterest-grid {
            columns: 3;
            column-gap: 20px;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
        }

        .pin {
            background: white;
            break-inside: avoid;
            margin-bottom: 20px;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            cursor: pointer;
            display: block;
            border: 1px solid #ebd9eb;
        }
        
        .pin:hover {
            transform: scale(1.02);
            box-shadow: 0 12px 30px rgba(0,0,0,0.12);
        }

        /* Pure CSS Canvas Graphics Block (Completely Firewall-Safe) */
        .card-graphic {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
        }

        .like-container {
            padding: 15px;
            background: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #fcf6fc;
        }
        .caption {
            font-size: 16px;
            color: #6d6d6d;
        }
        .like-btn {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            transition: transform 0.2s ease;
            color: #e2cee2;
        }
        .like-btn.liked {
            color: #e50914;
            transform: scale(1.25);
        }

        @media (max-width: 600px) {
            .pinterest-grid { columns: 2; column-gap: 12px; }
            .header h1 { font-size: 36px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>pictures</h1>
        <p>my cute little collection ♡</p>
        <a href="index.html" class="back-btn">♡ go back home</a>
    </div>

    <!-- Bulletproof Pinterest Board Layout Using Pure CSS Background Art Blocks -->
    <div class="pinterest-grid">

        <!-- PIN 1: Strawberry Cream -->
        <div class="pin">
            <div class="card-graphic" style="height: 260px; background: linear-gradient(135deg, #fff0f5, #ffdee4);">🍓</div>
            <div class="like-container">
                <span class="caption">strawberry dream ♡</span>
                <button class="like-btn" onclick="toggleLike(this)">♥</button>
            </div>
        </div>

        <!-- PIN 2: Starry Magic -->
        <div class="pin">
            <div class="card-graphic" style="height: 380px; background: linear-gradient(180deg, #e0bfdf, #bfafe0);">🌙</div>
            <div class="like-container">
                <span class="caption">starry pastel sky ✨</span>
                <button class="like-btn" onclick="toggleLike(this)">♥</button>
            </div>
        </div>

        <!-- PIN 3: Bunny Cloud -->
        <div class="pin">
            <div class="card-graphic" style="height: 220px; background: linear-gradient(135deg, #f3e1f3, #e8d5f5);">🐇</div>
            <div class="like-container">
                <span class="caption">cloud baby bunny ☁️</span>
                <button class="like-btn" onclick="toggleLike(this)">♥</button>
            </div>
        </div>

        <!-- PIN 4: Cute Bear Room -->
        <div class="pin">
            <div class="card-graphic" style="height: 310px; background: linear-gradient(135deg, #fff5f7, #ffccd5);">🧸</div>
            <div class="like-container">
                <span class="caption">plushie aesthetics 🎀</span>
                <button class="like-btn" onclick="toggleLike(this)">♥</button>
            </div>
        </div>

        <!-- PIN 5: Morning Matcha -->
        <div class="pin">
            <div class="card-graphic" style="height: 240px; background: linear-gradient(135deg, #f0f7f0, #c2e0c2);">🍵</div>
            <div class="like-container">
                <span class="caption">cozy matcha tea 🍃</span>
                <button class="like-btn" onclick="toggleLike(this)">♥</button>
            </div>
        </div>

        <!-- PIN 6: Angel Fairy -->
        <div class="pin">
            <div class="card-graphic" style="height: 290px; background: linear-gradient(135deg, #fbf5ff, #ebd6fd);">👼</div>
            <div class="like-container">
                <span class="caption">angel fairy core ⭐️</span>
                <button class="like-btn" onclick="toggleLike(this)">♥</button>
            </div>
        </div>

    </div>

    <div class="footer">
        made by sugxrbunnyx ♡
    </div>

    <script>
        function toggleLike(btn) {
            btn.classList.toggle('liked');
        }
    </script>
</body>
</html>
