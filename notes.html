<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<title>pictures</title>

<link href="https://fonts.googleapis.com/css2?family=Delius&display=swap" rel="stylesheet">

<style>

body{
background:#edd8ed;
font-family:"Delius",cursive;
margin:0;
padding:50px;
color:#6d6d6d;
}

.card{
background:white;
max-width:1050px;
margin:auto;
padding:35px;
border-radius:35px;
box-shadow:0 12px 30px rgba(0,0,0,.15);
text-align:center;
}

h1{
font-size:58px;
font-weight:normal;
margin-bottom:10px;
}

p{
font-size:24px;
margin-bottom:35px;
}

img{
width:100%;
border-radius:25px;
box-shadow:0 8px 20px rgba(0,0,0,.18);
}

.button{
display:inline-block;
margin-top:35px;
background:#f8edf8;
padding:15px 35px;
border-radius:35px;
text-decoration:none;
color:#6d6d6d;
font-size:24px;
transition:.3s;
}

.button:hover{
background:#edd8ed;
transform:translateY(-3px);
}

</style>

</head>

<body>

<div class="card">

<h1>pictures</h1>

<p>my cute little collection ♡</p>

<img src="sugxrbunnyx.png" alt="collection">

<a class="button" href="index.html">⌂ home</a>

</div>

</body>
</html>
