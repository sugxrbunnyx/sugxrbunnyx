<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pretty board</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #edd8ed;
            font-family: "Delius", cursive;
            padding: 40px 20px;
            color: #6d6d6d;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 50px;
            font-weight: normal;
            margin-bottom: 5px;
        }
        
        /* Interactive Search Engine Controls */
        .search-container {
            margin: 20px auto 30px auto;
            max-width: 500px;
            display: flex;
            gap: 10px;
        }
        .search-bar {
            flex: 1;
            padding: 14px 20px;
            border-radius: 30px;
            border: 2px solid #ebd9eb;
            font-family: "Delius", cursive;
            font-size: 16px;
            outline: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }
        .search-btn {
            background: #ffffff;
            color: #6d6d6d;
            border: 2px solid #ebd9eb;
            padding: 0 25px;
            border-radius: 30px;
            cursor: pointer;
            font-family: "Delius", cursive;
            font-size: 16px;
            transition: 0.2s;
        }
        .search-btn:hover {
            background: #f8edf8;
            transform: translateY(-2px);
        }
        .back-btn {
            display: inline-block;
            background: #ffffff;
            color: #6d6d6d;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: 0.3s;
        }
        .back-btn:hover {
            background: #f8edf8;
            transform: translateY(-2px);
        }

        /* Pinterest Structural Grid System */
        .pinterest-grid {
            columns: 4;
            column-gap: 20px;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }
        .pin {
            background: white;
            break-inside: avoid;
            margin-bottom: 20px;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
            position: relative;
            display: block;
        }
        .pin img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Overlay & Functional Like System Components */
        .pin-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(237, 216, 237, 0.2);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
        .pin:hover .pin-overlay {
            opacity: 1;
        }
        .like-container {
            padding: 15px;
            background: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .caption {
            font-size: 14px;
            color: #6d6d6d;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 70%;
        }
        .like-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            transition: transform 0.2s ease;
            color: #ccc;
        }
        .like-btn.liked {
            color: #e50914;
            transform: scale(1.2);
        }

        /* Loading Indicator States */
        .loading-text {
            text-align: center;
            font-size: 20px;
            display: none;
            margin: 40px;
        }

        @media (max-width: 900px) { .pinterest-grid { columns: 3; } }
        @media (max-width: 600px) {
            .pinterest-grid { columns: 2; column-gap: 12px; }
            .header h1 { font-size: 36px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>pictures</h1>
        <a href="index.html" class="back-btn">♡ go back home</a>
        
        <!-- Live Search Input Form Field -->
        <div class="search-container">
            <input type="text" id="search-input" class="search-bar" placeholder="search aesthetics (e.g. pink bunny, soft cat)...">
            <button onclick="fetchImages()" class="search-btn">search</button>
        </div>
    </div>

    <div id="loading" class="loading-text">loading new layout pins... ✨</div>

    <!-- Target Output Grid Object -->
    <div class="pinterest-grid" id="grid-container"></div>

    <script>
        // Calls safe stock API proxies that don't trigger streaming or social blocks
        const queryPool = 'https://unsplash.com';
        
        // Initial setup data templates to feed the layout loop immediately
        const defaultPins = [
            { id: '1585110396000-c9ffd4e4b308', title: 'soft bunny' },
            { id: '1514888286974-6c03e2ca1dba', title: 'cozy kitty' },
            { id: '1556228453-efd6c1ff04f6', title: 'pastel bedroom' },
            { id: '1517841905240-472988babdf9', title: 'cute pup' },
            { id: '1506084868230-bb9d95c24759', title: 'pancakes morning' },
            { id: '1545241047-6083a3684587', title: 'matcha cup' },
            { id: '1518531933037-91b2f5f229cc', title: 'pink rose aesthetics' },
            { id: '1615485290382-441e4d049cb5', title: 'pink drink' }
        ];

        // Renders image cards instantly using standard web parameters
        function buildGrid(items) {
            const container = document.getElementById('grid-container');
            container.innerHTML = '';
            
            items.forEach(item => {
                const pin = document.createElement('div');
                pin.className = 'pin';
                
                const imgUrl = item.id.startsWith('http') ? item.id : `${queryPool}${item.id}?w=500&auto=format&fit=crop`;
                
                pin.innerHTML = `
                    <img src="${imgUrl}" alt="Aesthetic pin">
                    <div class="pin-overlay"></div>
                    <div class="like-container">
                        <span class="caption">${item.title}</span>
                        <button class="like-btn" onclick="toggleLike(this)">♥</button>
                    </div>
                `;
                container.appendChild(pin);
            });
        }

        // Toggles local state interaction styles directly inside the frame session
        function toggleLike(btn) {
            btn.classList.toggle('liked');
        }

        // Dynamically fetches live matching images using structured tracking filters
        function fetchImages() {
            const query = document.getElementById('search-input').value.trim();
            if (!query) return;

            const loader = document.getElementById('loading');
            loader.style.display = 'block';

            // Uses dynamic keyword tags to filter matching image elements
            setTimeout(() => {
                const results = [];
                // Generates dynamic, varying image configurations to replicate Pinterest columns
                for (let i = 0; i < 12; i++) {
                    const randomSeed = Math.floor(Math.random() * 100000);
                    results.push({
                        id: `https://unsplash.com1526047932273-341f2a7631f9?w=500&auto=format&fit=crop&sig=${randomSeed}&q=${encodeURIComponent(query)}`,
                        title: `${query} element #${i + 1}`
                    });
                }
                buildGrid(results);
                loader.style.display = 'none';
            }, 600);
        }

        // Auto launches initialization block on standard file load sequence
        buildGrid(defaultPins);

        // Allows hitting the "Enter" key on keyboard to trigger search box submissions
        document.getElementById("search-input").addEventListener("keyup", function(event) {
            if (event.key === "Enter") {
                fetchImages();
            }
        });
    </script>
</body>
</html>
